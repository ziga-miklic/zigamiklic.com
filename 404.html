<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#313846">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#313846">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex, follow" />
  <title>Page not found - Blog by Žiga Miklič</title>
  <link rel="stylesheet" href="/assets/css/reboot.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script>
    (function () {
      var m = document.cookie.match(/(?:^|; )zm-theme=(light|dark)/);
      if (m) document.documentElement.classList.add("theme--" + m[1]);
    })();
  </script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body>

  <div class="site">
    <div class="container">

<div class="main">
  <div class="page-error">
    <h1 class="page-error__title">404</h1>
    <div class="page-error__text">Something does not seem right with that URL.</div>
    <div class="page-error__text">Click <a href="/">here</a> to go to the home page.</div>
  </div>
</div>

      <footer class="footer">
        <div class="footer__avatar">
          <img loading="lazy" src="/assets/img/avatar.jpg" alt="Žiga Miklič">
        </div>
        <div class="footer__main">Blog by <a target="_blank" rel="noreferrer" href="https://twitter.com/zigamiklic">Žiga Miklič</a></div>
        <div class="footer__desc">Thank you for visiting my small fragment of the web.</div>

        <button type="button" class="theme-switch" id="theme-switch">
          <svg xmlns="http://www.w3.org/2000/svg" class="theme-switch__icon-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>

          <svg xmlns="http://www.w3.org/2000/svg" class="theme-switch__icon-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>

          Switch theme
        </button>
      </footer>  
    </div>
  </div>
</body>
</html>
